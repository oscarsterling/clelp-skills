# CI for the clelp-mcp-server subdirectory only
name: clelp-mcp-server CI

on:
  push:
    paths:
      - 'clelp-mcp-server/**'
      - '.github/workflows/clelp-mcp-server-ci.yml'
  pull_request:
    paths:
      - 'clelp-mcp-server/**'
      - '.github/workflows/clelp-mcp-server-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clelp-mcp-server
    strategy:
      matrix:
        # Node 18 dropped 2026-09-06 (Jason, TG 34987): EOL since 2025-04, and its job
        # had failed the same four e2e subtests on every run since 2026-07-31 while
        # Node 20 passed, so it only trained us to ignore a red check.
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: clelp-mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
